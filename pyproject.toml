[project]
name = "ida-code"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastmcp>=2.0"]
description = "MCP server for AI-assisted IDAPython scripting"

[project.scripts]
ida-code = "ida_code.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ida_code"]
