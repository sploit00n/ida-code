name: Publish to PyPI

on:
    push:
        branches:
            - main

jobs:
    check-version:
        runs-on: ubuntu-latest
        outputs:
            should_publish: ${{ steps.check.outputs.should_publish }}
            version: ${{ steps.check.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Check if version changed
              id: check
              run: |
                  LOCAL_VERSION=$(uv version --short)
                  echo "Local version: $LOCAL_VERSION"
                  echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

                  PYPI_VERSION=$(curl -sf https://pypi.org/pypi/ida-code/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null) || PYPI_VERSION=""
                  echo "PyPI version: $PYPI_VERSION"

                  if [ "$LOCAL_VERSION" != "$PYPI_VERSION" ]; then
                    echo "should_publish=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "should_publish=false" >> "$GITHUB_OUTPUT"
                  fi

    publish:
        needs: check-version
        if: needs.check-version.outputs.should_publish == 'true'
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Build sdist and wheel
              run: uv build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist/
